name: Release portable Windows binary

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6

      - name: Verify the public-release license gate
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath LICENSE)) {
            throw 'A project LICENSE must be committed before publishing binaries.'
          }

      - name: Install Free Pascal 3.2.2
        shell: pwsh
        run: |
          $installerUri = 'https://downloads.freepascal.org/fpc/dist/3.2.2/i386-win32/fpc-3.2.2.win32.and.win64.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'fpc-3.2.2.win32.and.win64.exe'
          $expectedHash = '8c255390544b051388b577eb61c6191a04883264afe0e3369b3600a56daf7bde'
          Invoke-WebRequest -Uri $installerUri -OutFile $installer
          $actualHash = (Get-FileHash -LiteralPath $installer `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Free Pascal installer checksum mismatch: $actualHash"
          }

          $fpcRoot = Join-Path $env:RUNNER_TEMP 'fpc-3.2.2'
          & $installer '/VERYSILENT' '/SUPPRESSMSGBOXES' '/NORESTART' `
            '/NOICONS' "/DIR=$fpcRoot" '/TYPE=minimum' '/TASKS=createcfg'
          if ($LASTEXITCODE -ne 0) {
            throw "Free Pascal installer failed with exit code $LASTEXITCODE"
          }

          $fpcBin = Join-Path $fpcRoot 'bin\i386-win32'
          $requiredTools = @(
            'fpc.exe', 'ppcrossx64.exe', 'x86_64-win64-windres.exe',
            'x86_64-win64-ld.exe'
          )
          $missingTools = @(
            $requiredTools | Where-Object {
              -not (Test-Path -LiteralPath (Join-Path $fpcBin $_))
            }
          )
          if ($missingTools.Count -gt 0) {
            throw "Free Pascal Win64 toolchain is missing: $($missingTools -join ', ')"
          }
          $fpc = Join-Path $fpcBin 'fpc.exe'
          $installedVersion = (& $fpc -Twin64 -Px86_64 -iV | Out-String).Trim()
          $installedTarget = (& $fpc -Twin64 -Px86_64 -iTP | Out-String).Trim()
          $installedOS = (& $fpc -Twin64 -Px86_64 -iTO | Out-String).Trim()
          if ($installedVersion -ne '3.2.2' -or
              $installedTarget -ne 'x86_64' -or $installedOS -ne 'win64') {
            throw "Expected Free Pascal 3.2.2 for x86_64-win64; found $installedVersion for $installedTarget-$installedOS"
          }
          [IO.File]::AppendAllText($env:GITHUB_PATH,
            "$fpcBin`n",
            [Text.UTF8Encoding]::new($false))
          [IO.File]::AppendAllText($env:GITHUB_ENV,
            "PASWEAVE_FPC=$fpc`n" +
            "PASWEAVE_WINDRES=$fpcBin\x86_64-win64-windres.exe`n",
            [Text.UTF8Encoding]::new($false))

      - name: Build and smoke-test the portable executable
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          .\scripts\build-portable-windows.ps1 `
            -Fpc $env:PASWEAVE_FPC -Windres $env:PASWEAVE_WINDRES `
            -ExpectedVersion $version

      - name: Publish the raw executable and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            'dist/pasweave.exe', 'dist/pasweave.exe.sha256',
            '--verify-tag',
            '--title', "PasWeave $env:GITHUB_REF_NAME"
          )
          $notesFile = "RELEASE_NOTE_$($env:GITHUB_REF_NAME).md"
          if (Test-Path -LiteralPath $notesFile) {
            $arguments += @('--notes-file', $notesFile)
          } else {
            $arguments += '--generate-notes'
          }
          if ($env:GITHUB_REF_NAME.Contains('-')) {
            $arguments += '--prerelease'
          }
          gh @arguments
